<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>운명잡화점</title>

<meta property="og:type" content="website" />
<meta property="og:title" content="나를 한마디로 고른다면?" />
<meta property="og:description" content="열두 개 중 하나만 고르면 끝. 10초면 돼요" />
<meta property="og:image" content="https://pitchkorea.github.io/unmyeongstore-pages/pick/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://pitchkorea.github.io/unmyeongstore-pages/pick/" />

<style>
      :root{
    --cream:#FDF7EA; --cream-line:#E9DCBF;
        --gold:#FFD07A; --gold-deep:#D4890F; --gold-ink:#7F4F04; --gold-glow:rgba(255,208,122,.32);
        --ink:#3A2E52; --ink-faint:#73668E;
            --on-n:#F6ECDA; --on-n-dim:#D9CAAE; --on-n-faint:#BCAE99;
    --danger:#E4767A;
        --wood:#381A14; --wood-line:#6B4A2E;
    --r-md:16px; --r-lg:22px; --r-pill:999px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
      body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,'Noto Sans KR',system-ui,sans-serif;
    background:var(--wood);
    color:var(--on-n);line-height:1.5;min-height:100vh;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
  }
  #app{max-width:430px;margin:0 auto}
  .box{padding:22px 18px 26px;display:flex;flex-direction:column}
  .gap{gap:10px}
  .center{text-align:center;align-items:center}
  .brand{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.04em}
  h1{font-size:24px;line-height:1.36;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--on-n)}
  h2{font-size:19px;font-weight:800;margin:0;color:var(--on-n)}
  h3{font-size:15px;font-weight:800;margin:0;color:var(--ink)}
  p{margin:0;font-size:14.5px}
  .on-n{color:var(--on-n)}
  .ink{color:var(--ink);font-size:14px}
  .faint{font-size:12px;line-height:1.6;color:var(--ink-faint)}
  .faint-n{font-size:12.5px;line-height:1.6;color:var(--on-n-faint)}
  .lbl{font-size:12px;color:var(--on-n-faint);margin-top:6px}
  .lblRow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
  .lblRow .lbl{margin:0}

  .card{background:var(--cream);border:1px solid var(--cream-line);border-radius:var(--r-lg);
    padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25)}

  .btn{display:block;width:100%;font:inherit;font-size:15.5px;font-weight:800;padding:14px;border-radius:var(--r-pill);
    border:0;background:var(--gold);color:#3A2A0E;cursor:pointer;text-align:center;text-decoration:none;
    box-shadow:0 6px 18px rgba(255,208,122,.24);margin-top:4px}
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:transparent;color:var(--on-n-dim);border:1px solid rgba(255,255,255,.2);box-shadow:none;font-weight:600}
    .btn.ghost.on{background:var(--gold);border-color:var(--gold);color:#3A2A0E;font-weight:800}
  .btn[disabled]{opacity:.45}

  .row{display:flex;gap:8px}
  .f1{flex:1} .f17{flex:1.7}
  .field{display:flex;align-items:center;min-width:0;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:var(--r-md);padding:0 14px}
  .field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;
    padding:13px 0;color:var(--on-n)}
  .field input::placeholder{color:var(--on-n-faint)}
  .field .sfx{font-size:12px;color:var(--on-n-faint)}

  .chip{font:inherit;padding:6px 13px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.2);
    background:transparent;font-size:12.5px;color:var(--on-n-dim);cursor:pointer}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#3A2A0E;font-weight:800}

  .check{font:inherit;display:flex;align-items:center;gap:9px;background:transparent;border:0;padding:6px 0;
    color:var(--on-n-dim);font-size:13.5px;cursor:pointer;text-align:left}
  .check .box14{position:relative;width:20px;height:20px;border-radius:6px;
    border:1.6px solid rgba(255,255,255,.32);flex:0 0 auto}
  .check.on .box14{background:var(--gold);border-color:var(--gold)}
    .check.on .box14::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid #3A2A0E;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check.on{color:var(--on-n)}

  .err{color:var(--danger);font-size:13px}

      .notice{background:var(--cream);border:1px solid var(--cream-line);
    border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:5px}
  .notice p{font-size:12.5px;line-height:1.6;color:var(--ink-faint);margin:0}
  .notice b{color:var(--ink);font-weight:800;margin-right:6px}
    .notice .plink{color:var(--gold-ink)}
  .plink{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
    .linkish{font:inherit;font-size:12.5px;background:transparent;border:0;padding:0;cursor:pointer;
    color:var(--on-n-faint);text-decoration:underline;text-underline-offset:2px}
  .btn.danger{background:var(--danger);color:#fff;box-shadow:none}
    .linkish.ink{color:var(--ink-faint)}
  .notice .row{margin-top:4px}
    .code{font-size:30px;font-weight:800;letter-spacing:7px;text-align:center;
        color:var(--gold);margin:6px 0;font-variant-numeric:tabular-nums;
        -webkit-user-select:all;user-select:all}

    .linkbox{font-size:12.5px;line-height:1.5;color:var(--on-n-dim);word-break:break-all;margin:2px 0 0;
    background:rgba(0,0,0,.18);border-radius:10px;padding:9px 11px;-webkit-user-select:all;user-select:all}

    .card .btn.ghost{color:var(--gold-ink);border-color:var(--cream-line);font-weight:800}

    .uses{display:flex;flex-direction:column;gap:10px}
  .useRow{display:flex;align-items:center;gap:10px}
  .useRow .who{flex:1;min-width:0}
  .useRow .nm{font-size:14px;font-weight:800;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .useRow .sc{font-size:18px;font-weight:800;color:var(--gold-ink)}
    .useRow .artGlow::before{display:none}

  .artGlow{position:relative;display:inline-flex;align-items:center;justify-content:center}
  .artGlow::before{content:'';position:absolute;width:76%;height:50%;bottom:4%;border-radius:50%;
    background:radial-gradient(ellipse,var(--gold-glow),transparent 70%)}
  .art{position:relative;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
  .pairArt{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .cname{font-size:17px;font-weight:800}

    .shotCard{display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:18px 14px 20px;border-radius:var(--r-lg);background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12)}
  .pairTitle{font-size:23px;line-height:1.35;font-weight:800;color:var(--gold);text-align:center;margin:0}
  .pairFit{font-size:15px;line-height:1.6;text-align:center;margin:0}
    .pairCopy{font-size:14px;line-height:1.55;font-weight:800;color:var(--gold);text-align:center;margin:0}

  .scoreRow{display:flex;align-items:baseline;justify-content:center;gap:5px}
    .score{font-size:26px;font-weight:800;color:var(--gold);line-height:1.1}

  .metric{display:flex;flex-direction:column;gap:4px}
  .metricRow{display:flex;align-items:center;gap:9px}
  .metricRow .mk{font-size:13px;font-weight:800;min-width:56px;flex-shrink:0}
  .track{flex:1;height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.12);overflow:hidden}
  .track.ink{background:#EDE4D0}
    .track > i{display:block;height:100%;border-radius:var(--r-pill);background:var(--gold-deep)}

      .gmap{display:block;width:100%;max-width:360px;margin:2px auto 0;border-radius:14px}
  .gline line{stroke:#B5503E;stroke-width:5;opacity:.75}
  .gdot text{fill:var(--ink);font-size:32px;font-weight:800;text-anchor:middle}

    .card .useRow .ink{text-align:right}

    .door{position:relative;width:100%;aspect-ratio:1280/853;overflow:hidden;
    background:var(--wood);margin-bottom:2px}
    .door::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16%;
    background:linear-gradient(180deg,rgba(56,26,20,0) 0%,var(--wood) 100%)}
  .door img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
    .door .onmat{position:absolute;left:50%;top:79%;transform:translate(-50%,-100%);
    display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}

    .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chips .btn{margin-top:0;padding:12px 10px;font-size:13.5px;line-height:1.35;border-radius:14px}

    .duo{display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 14px 18px;border-radius:var(--r-lg);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
  .duo .arts{display:flex;align-items:flex-end;justify-content:center;gap:10px}
  .duo .fit{font-size:14.5px;line-height:1.6;text-align:center;margin:0}
  .duo .sc{font-size:30px;font-weight:800;color:var(--gold);line-height:1.1}
  .duo .scLabel{font-size:11.5px;color:var(--on-n-faint)}

    .paper{position:relative;background:var(--cream);border:1px solid var(--cream-line);
    border-radius:var(--r-lg);padding:20px 16px 18px;display:flex;flex-direction:column;gap:2px;
    box-shadow:0 10px 30px rgba(0,0,0,.28)}
    .paper::before,.paper::after{content:'';position:absolute;top:9px;width:7px;height:7px;
    border-radius:50%;background:var(--gold-ink);opacity:.55}
  .paper::before{left:12px} .paper::after{right:12px}

    .paper h2{color:var(--ink)}
  .paper .faint-n{color:var(--ink-faint)}
  .paper .lbl{color:var(--ink-faint);margin-top:10px}
  .paper .lblRow{margin-top:10px}
  .paper .lblRow .lbl{margin:0}

    .paper .field{background:#FFFBF2;border:1.2px solid var(--gold-ink);border-radius:12px}
  .paper .field input{color:var(--ink)}
  .paper .field input::placeholder{color:var(--ink-faint)}
  .paper .field .sfx{color:var(--ink-faint)}

    .paper .chip{border-color:var(--cream-line);color:var(--ink-faint);background:#FFFBF2}
  .paper .chip.on{background:var(--gold);border-color:var(--gold);color:#3A2A0E}

    .paper .check{color:var(--ink)}
  .paper .check .box14{border-color:var(--gold-ink);background:#FFFBF2}
  .paper .check.on .box14{background:var(--gold);border-color:var(--gold)}
  .paper .check.on{color:var(--ink)}

    .paper .notice{background:transparent;border:0;border-top:1px solid var(--cream-line);
    border-radius:0;padding:12px 0 0;margin-top:12px}

    .btn.card{background:var(--cream);color:var(--ink);border:1.5px solid var(--cream-line);
    box-shadow:0 6px 16px rgba(0,0,0,.22);font-weight:800}
  .btn.card:active{background:#FFFBF2;border-color:var(--gold-ink);border-width:2px;transform:scale(.99)}
  .btn.card.on{background:#FFFBF2;border-color:var(--gold-ink);border-width:2px}

      @media (max-width: 380px){
        .door{aspect-ratio:auto;height:28vh;min-height:130px}
    .door .onmat{top:86%}
  }

  .stickyCta{position:sticky;bottom:0;width:100%;z-index:2;
    padding:10px 0 calc(env(safe-area-inset-bottom) + 6px);
    background:linear-gradient(180deg,rgba(56,26,20,0) 0%,var(--wood) 28%,var(--wood) 100%)}
  .stickyCta .btn{margin-top:0}

  [hidden]{display:none !important}
</style>
</head>

<div id="app"></div>
